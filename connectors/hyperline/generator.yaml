# Tells connector-gen which OpenAPI endpoints to turn into Python client methods.
name: hyperline
openapi: openapi.json  # downloaded Hyperline API spec (2MB, do not edit)
output: client_generated.py
class_name: HyperlineClientGenerated

# Operations to generate from OpenAPI (method + path)
operations:
  - name: get_customer_v2
    method: get
    path: /v2/customers/{id}

  - name: list_customers_v2
    method: get
    path: /v2/customers

  - name: get_invoice_v1
    method: get
    path: /v1/invoices/{id}

  - name: list_invoices_v1
    method: get
    path: /v1/invoices

  - name: create_customer_v1
    method: post
    path: /v1/customers

  - name: create_invoice_v1
    method: post
    path: /v1/invoices
