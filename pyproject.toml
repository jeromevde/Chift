[project]
name = "chift-hyperline-poc"
version = "0.1.0"
description = "POC: OpenAPI codegen + Hyperline → Chift invoicing connector"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "email-validator>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "datamodel-code-generator>=0.76",
    "ruff>=0.6",
]

[project.scripts]
generate = "cli.generate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["chift*", "cli*", "connectors*", "codegen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
