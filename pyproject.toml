[project]
name = "chift-hyperline-poc"
version = "0.1.0"
description = "POC: OpenAPI codegen + Hyperline → Chift invoicing connector"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "iso4217==1.16.20260101",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "email-validator>=2.0",
    "PyYAML>=6.0",
    "fastapi>=0.115",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.16.6",
]

[project.scripts]
chift-codegen = "codegeneration.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["chift*", "codegeneration*", "connectors*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["robustness: runs the pipeline against downloaded third-party specs"]
addopts = "-m 'not robustness'"
