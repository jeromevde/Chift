          example: EUR
        status:
          type: string
          enum:
          - to_pay
          - paid
          - draft
          default: paid
          description: 'Current invoice status.


            - `draft`: Invoice is in draft mode (not finalized yet).

            - `open`: Invoice for the current billing period, which will be issued
            at the end of the period (used for invoices with usage-based data).

            - `grace_period`: Invoice is in a review period after being issued for
            the billing period and before becoming due for payment.

            - `to_pay`: Invoice is awaiting payment.

            - `partially_paid`: Invoice is partially paid.

            - `paid`: Invoice is fully paid.

            - `voided`: Invoice has been voided and is no longer valid.

            - `closed`: Invoice was not issued and has been discarded.

            - `error`: Invoice failed to be paid.

            - `archived`: A previous version of an invoice.

            - `charged_on_parent`: Invoice is charged on the parent customer.

            - `pending_parent_concat`: Invoice is pending invoices concatenation on
            the parent customer to be grouped.

            - `uncollectible`: Invoice is uncollectible (bad debt). Only metadata
            (properties, custom_note, custom_properties) can be updated in this status.

            '
          example: paid
        invoicing_entity_id:
          type: string
          description: ID of the invoicing entity attached to the invoice.
          example: ive_47484fjdhy5
        number:
          type: string
          description: Invoice number. If specified, the invoice will be considered
            as imported from an external source and the number will not be generated
            by Hyperline. You are responsible for avoiding duplicates and ensuring
            it does not impact the numbering sequence in Hyperline.
          example: INV-35
        type:
          type: string
          enum:
          - invoice
          - credit_note
          - document
          description: "Type of the invoice.\n\n- `invoice`: Legal invoice to be paid\
            \ by your customer.\n- `credit_note`: Legal credit note cancelling an\
            \ invoice and refunding your customer.\n- `document`: Custom document\
            \ with no legal value. Can be generated from a subscription to meet specific\
            \ needs.\n  "
          example: invoice
        document_name:
          type: string
          description: If the invoice is of type `document` you can give it a custom
            name (displayed on the final PDF).
        reference:
          type: string
          description: Unique identifier to ease reconciliation with payment. Useful
            for bank transfer.
          example: V0KAHOU6J3
        purchase_order:
          type: string
          description: Reference to the purchase order linked to the invoice.
          example: PO-12345
        custom_note:
          type: string
          maxLength: 20000
          description: Custom note added to the invoice.
          example: Thank you for your purchase!
        additional_info:
          type: string
          maxLength: 20000
          description: Additional information added to the invoice. If not defined,
            it will be inherited from the invoicing entity's settings.
          example: This invoice must be paid within the payment delay indicated. After
            this period a late payment penalty of 10% will be applied.
        footer:
          type: string
          maxLength: 20000
          description: Footer added to the invoice. If not defined, it will be inherited
            from the invoicing entity's settings.
          example: "ACME (Acme SAS) is a company registered in France | SIREN N\xB0\
            123456"
        tax_rate:
          type: number
          minimum: 0
          maximum: 100
          description: Deprecated field, please use `line_items[].tax_rate`.
          deprecated: true
        tax_scheme:
          type: string
          enum:
          - auto
          - not_eligible
          default: auto
          description: "Tax scheme of the invoice.\n\n- `auto`: Tax is automatically\
            \ computed and applied.\n- `not_eligible`: Tax collection is disabled\
            \ for the invoice.\n  "
          example: auto
        payment_method_strategy:
          type: string
          enum:
          - current
          - external
          description: '

            Payment method strategy used to charge the invoice. Only applies to `to_pay`
            status.


            - `current`: Use the current default payment method of the customer.

            - `external`: Manage the payment of the invoice outside of Hyperline.

            '
          example: external
        payment_method_id:
          type: string
          description: ID of the default payment method used to pay the invoice. Transactions
            related to the invoice may use different payment methods.
          example: pm_1ryTrMj4TTAT1N
        bank_account_id:
          type: string
          description: ID of the bank account displayed on the invoice. Transactions
            related to the invoice may use different bank accounts.
          example: bac_KJyPrMA1toAqRG
        subscription_id:
          type: string
          description: ID of the subscription related to the invoice.
          example: sub_amiaWZ3lzDIWaoT
        emitted_at:
          type: string
          format: date-time
          description: Issue date of the invoice.
          example: '2024-10-13T00:00:00.000Z'
        due_at:
          type: string
          format: date-time
          description: Due date of the invoice. Computed from the issue date and the
            payment delay configured in your settings.
          example: '2024-11-12T00:00:00.000Z'
        settled_at:
          type: string
          format: date-time
          description: Date the invoice was fully paid.
          example: '2024-10-15T14:01:56.000Z'
        properties:
          type: object
          additionalProperties:
            anyOf:
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
            - type: array
              items:
                anyOf:
                - type: string
                - type: number
                - type: boolean
                - type: 'null'
                - type: 'null'
            - type: 'null'
          description: Key/value pairs to store any metadata useful in your context.
        custom_properties:
          type: object
          additionalProperties:
            anyOf:
            - type: string
            - type: number
            - type: boolean
            - type: string
              format: date-time
              description: UTC date time string in the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
                format.
              example: '2024-12-20T16:04:11Z'
            - type: array
              items:
                type: string
            - type: 'null'
          description: Values for custom properties defined for the `invoice` entity,
            keyed by slug.
        additional_display_fields:
          type: array
          items:
            oneOf:
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - standard
                  description: Display a standard invoice field.
                field:
                  type: string
                  enum:
                  - customer_id
                  - subscription_id
                  - quote_id
                  description: Standard invoice field to display.
              required:
              - type
              - field
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - custom_property
                  description: Display an invoice or customer custom property.
                slug:
                  type: string
                  description: Slug of the invoice or customer custom property to
                    display.
              required:
              - type
              - slug
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - custom
                  description: Display a custom label and value.
                label:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Label displayed on the invoice.
                value:
                  type: string
                  maxLength: 500
                  description: Value displayed on the invoice.
              required:
              - type
              - label
              - value
          maxItems: 20
          description: Ordered additional fields displayed on the invoice PDF. Invoice
            and customer custom properties are referenced by slug.
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/CreateInvoiceLineItem'
          minItems: 1
        transactions:
          type: array
          items:
            anyOf:
            - type: object
              properties:
                amount:
                  type: number
                  minimum: 0
                  description: Transaction amount.
                  example: 31500
                process_at:
                  type: string
                  format: date-time
                  description: Date corresponding to the processing of the transaction.
                    If in the future, the transaction is scheduled to be processed.
                  example: '2024-11-12T07:38:39.222Z'
                payment_method_id:
                  type: string
                  description: Payment method used to execute the transaction. Only
                    applies to scheduled transactions with a process_at date in the
                    future.
                  example: pm_1xMpj5bwRqN7LM
              required:
              - amount
              - process_at
              - payment_method_id
              title: Payment method
            - type: object
              properties:
                amount:
                  type: number
                  minimum: 0
                  description: Transaction amount.
                  example: 31500
                process_at:
                  type: string
                  format: date-time
                  description: Date corresponding to the processing of the transaction.
                    If in the future, the transaction is scheduled to be processed.
                  example: '2024-11-12T07:38:39.222Z'
                payment_method_type:
                  type: string
                  enum:
                  - transfer
                bank_account_id:
                  type: string
                  description: Bank account linked to the transaction.
                  example: bac_KJyPrMA1toAqRG
              required:
              - amount
              - process_at
              - payment_method_type
              title: Bank transfer
            - type: object
              properties:
                amount:
                  type: number
                  minimum: 0
                  description: Transaction amount.
                  example: 31500
                process_at:
                  type: string
                  format: date-time
                  description: Date corresponding to the processing of the transaction.
                    If in the future, the transaction is scheduled to be processed.
                  example: '2024-11-12T07:38:39.222Z'
                provider_name:
                  type: string
                  enum:
                  - airwallex
                  - gocardless
                  - mollie
                  - stripe
                  description: Provider name.
                provider_id:
                  type: string
                  description: Provider ID. Required if multiple instances of the
                    same provider are connected in Hyperline.
                provider_transaction_id:
                  type: string
                  description: ID of the transaction on the provider's side. If the
                    transaction is pending, Hyperline will automatically refresh it
                    with the latest details until it is settled. Note that the `amount`
                    and `process_at` fields may be overridden by the transaction data.
              required:
              - provider_name
              - provider_transaction_id
              title: Provider transaction
            - type: object
              properties:
                amount:
                  type: number
                  minimum: 0
                  description: Transaction amount.
                  example: 31500
                process_at:
                  type: string
                  format: date-time
                  description: Date corresponding to the processing of the transaction.
                    If in the future, the transaction is scheduled to be processed.
                  example: '2024-11-12T07:38:39.222Z'
                payment_method_type:
                  type: string
                  enum:
                  - external
              required:
              - amount
              - process_at
              title: External transaction
        coupons:
          type: array
          items:
            anyOf:
            - type: object
              properties:
                coupon_id:
                  type: string
                  description: Coupon ID.
                  example: cou_1eTaiytfA0i2Vb
                name:
                  type: string
                  description: Name of the coupon.
                  example: Black Friday 2023
                discount_amount:
                  type: number
                  exclusiveMinimum: 0
                  description: Amount corresponding to the discounted part of the
                    total amount.
                  example: 500
                line_item_indexes:
                  type:
                  - array
                  - 'null'
                  items:
                    type: number
                  description: Index of the line items to which the coupon applies.
                    Null means all line items.
                  example:
                  - 0
                  - 1
              required:
              - coupon_id
              title: Coupon amount
            - type: object
              properties:
                name:
                  type: string
                  description: Name of the coupon.
                  example: Black Friday 2023
                discount_amount:
                  type: number
                  exclusiveMinimum: 0
                  description: Amount corresponding to the discounted part of the
                    total amount.
                  example: 500
                line_item_indexes:
                  type:
                  - array
                  - 'null'
                  items:
                    type: number
                  description: Index of the line items to which the coupon applies.
                    Null means all line items.
                  example:
                  - 0
                  - 1
              required:
              - name
              - discount_amount
              - line_item_indexes
              title: Inline coupon
      required:
      - customer_id
      - line_items
