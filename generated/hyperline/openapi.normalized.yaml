    UpdateBankAccount:
      allOf:
      - type: object
        properties:
          bank_name:
            type:
            - string
            - 'null'
            description: Bank name.
            example: Fake bank
      - anyOf:
        - type: object
          properties:
            format:
              type: string
              enum:
              - iban_bic_swift
              description: Bank account details format.
              example: iban_bic_swift
            iban:
              type: string
              description: IBAN.
              example: FR7630006000011234567890189
            bic_swift:
              type:
              - string
              - 'null'
              description: BIC or SWIFT code.
              example: BNPAFRPP
          required:
          - format
          - iban
          - bic_swift
        - type: object
          properties:
            format:
              type: string
              enum:
              - sort_code_account_number
              description: Bank account details format.
              example: sort_code_account_number
            sort_code:
              type: string
              description: Sort code.
              example: '123456'
            account_number:
              type: string
              description: Account number.
              example: 000123456789
          required:
          - format
          - sort_code
          - account_number
        - type: object
          properties:
            format:
              type: string
              enum:
              - account_number_routing_number
              description: Bank account details format.
              example: account_number_routing_number
            account_number:
              type: string
              description: Account number.
              example: 000123456789
            routing_number:
              type: string
              description: Routing number.
              example: '021000021'
          required:
          - format
          - account_number
          - routing_number
        - type: object
          properties:
            format:
              type: string
              enum:
              - account_number_bic_swift
              description: Bank account details format.
              example: account_number_bic_swift
            account_number:
              type: string
              description: Account number.
              example: 000123456789
            bic_swift:
              type: string
              description: BIC or SWIFT code.
              example: BNPAFRPP
          required:
          - format
          - account_number
          - bic_swift
        example:
          format: iban_bic_swift
          iban: FR7630006000011234567890189
          bic_swift: BNPAFRPP
      description: Custom bank account for the customer. If not defined and customer
        paying by bank transfer, the bank accounts configured in your account settings
        will be used.
    CreateInvoiceLineItem:
      allOf:
      - type: object
        properties:
          description:
            type: string
            maxLength: 5000
            description: Description of the line item as it will appear on the invoice.
              Default to the product description.
            example: Access fee for the period of November 2024
          units_count:
            type: number
            default: 1
            description: Count of units of the product related to the invoice line
              item.
            example: 1
          tax_rate:
            type: number
            minimum: 0
            maximum: 100
            description: Tax rate of the invoice line item.
            example: 20
          period_start:
            type: string
            format: date-time
            description: Start date of the period corresponding to the line item charge.
            example: '2024-10-13T00:00:00.000Z'
          period_end:
            type: string
            format: date-time
            description: End date of the period corresponding to the line item charge.
            example: '2024-11-13T00:00:00.000Z'
          display_unit_amount:
            type: boolean
            description: Whether the unit amount is displayed on the invoice PDF.
              Defaults to true.
            example: true
          display_service_period:
            type: boolean
            description: Whether the service period dates are displayed in the line
              item description on the invoice PDF. Defaults to true.
            example: true
      - type: object
        properties:
          product_id:
            type: string
            description: Product ID related to the invoice line item.
            example: itm_KbLcWt2qm5p1S2
          name:
            type: string
            description: Name of the line item as it will appear on the invoice. Default
              to the product name.
            example: Platform access
          unit_amount:
            type: number
            description: Amount of one unit of the product related to the invoice
              line item. Default to the product price amount. Expressed in currency's
              smallest unit.
            example: 24000
        additionalProperties: true
    InvoiceDeprecated:
      type: object
      properties:
        id:
          type: string
          description: Invoice ID.
          example: inv_1eTaiytfA0i2Va
        number:
          type: string
          description: Invoice number. Generated by Hyperline using the sequential
            numbering and format defined in your settings.
          example: INV-35
        type:
          type: string
          enum:
          - invoice
          - credit_note
          - document
          - child_invoice_ref
          - child_creditnote_ref
          description: "Type of the invoice.\n\n- `invoice`: Legal invoice to be paid\
            \ by your customer.\n- `credit_note`: Legal credit note cancelling an\
            \ invoice and refunding your customer.\n- `document`: Custom document\
            \ with no legal value. Can be generated from a subscription to meet specific\
            \ needs.\n  "
          example: invoice
        document_name:
          type:
          - string
          - 'null'
          description: If the invoice is of type `document` you can give it a custom
            name (displayed on the final PDF).
          example: null
        status:
          type: string
          enum:
          - draft
          - pending_approval
          - changes_requested
          - open
          - to_pay
          - grace_period
          - partially_paid
          - paid
          - voided
          - closed
          - error
          - missing_info
          - archived
          - charged_on_parent
          - pending_parent_concat
          - pending_consolidation
          - consolidated
          - uncollectible
          description: 'Current invoice status.


            - `draft`: Invoice is in draft mode (not finalized yet).

            - `open`: Invoice for the current billing period, which will be issued
            at the end of the period (used for invoices with usage-based data).

            - `grace_period`: Invoice is in a review period after being issued for
            the billing period and before becoming due for payment.

            - `to_pay`: Invoice is awaiting payment.

            - `partially_paid`: Invoice is partially paid.

            - `paid`: Invoice is fully paid.

            - `voided`: Invoice has been voided and is no longer valid.

            - `closed`: Invoice was not issued and has been discarded.

            - `error`: Invoice failed to be paid.

            - `archived`: A previous version of an invoice.

            - `charged_on_parent`: Invoice is charged on the parent customer.

            - `pending_parent_concat`: Invoice is pending invoices concatenation on
            the parent customer to be grouped.

            - `uncollectible`: Invoice is uncollectible (bad debt). Only metadata
            (properties, custom_note, custom_properties) can be updated in this status.

            '
          example: paid
