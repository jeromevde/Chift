  /v2/invoices/{id}:
    get:
      operationId: getInvoice
      tags:
      - Invoices
      security:
      - bearer: []
      summary: Get invoice
      description: Retrieve the details of an existing invoice.
      parameters:
      - schema:
          type: string
        required: true
        name: id
        in: path
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetails'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
  /v1/customers:
    post:
      operationId: createCustomer
      tags:
      - Customers
      security:
      - bearer: []
      summary: Create customer
      description: Create a new customer.
      requestBody:
        description: Create customer payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomer'
      responses:
        '201':
          description: The newly created customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailsV1'
  /v1/customers/{id}:
    delete:
      operationId: deleteCustomer
      tags:
      - Customers
      security:
      - bearer: []
      summary: Delete customer
      description: Delete an existing customer. The customer must be archived prior
        to the deletion.
      parameters:
      - schema:
          type: string
        required: true
        name: id
        in: path
      responses:
        '204':
          description: Customer deleted
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
  /v1/customers/{id}/archive:
    put:
      operationId: archiveCustomer
      tags:
      - Customers
      security:
      - bearer: []
      summary: Archive customer
      description: Archive an existing customer.
      parameters:
      - schema:
          type: string
        required: true
        name: id
        in: path
      responses:
        '200':
          description: Customer archived
          content:
