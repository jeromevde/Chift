          format: date-time
          description: Date the invoice grace period ended. This happens at the issue
            date + the grace period duration configured in your settings.
          example: null
        settled_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Date the invoice was fully paid.
          example: '2024-10-15T14:01:56.000Z'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Date of the last update.
          example: '2024-10-15T14:01:56.000Z'
        properties:
          type:
          - object
          - 'null'
          additionalProperties:
            anyOf:
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
            - type: array
              items:
                anyOf:
                - type: string
                - type: number
                - type: boolean
                - type: 'null'
                - type: 'null'
            - type: 'null'
          description: Key/value pairs to store any metadata useful in your context.
          example: null
        custom_properties:
          type:
          - object
          - 'null'
          additionalProperties:
            anyOf:
            - type: string
            - type: number
            - type: boolean
            - type: string
              format: date-time
              description: UTC date time string in the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
                format.
              example: '2024-12-20T16:04:11Z'
            - type: array
              items:
                type: string
            - type: 'null'
