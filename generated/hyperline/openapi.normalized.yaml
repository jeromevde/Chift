    InvoiceLineItem:
      type: object
      properties:
        id:
          type: string
          description: Invoice line item ID.
          example: ili_0FACNpeoEFkGu3
        name:
          type: string
          description: Name of the line item, corresponding to the related product.
          example: Platform access
        entry_type:
          type: string
          enum:
          - debit
          - credit
          description: Indicates whether the line item is a debit or credit.
          example: debit
        product_id:
          type:
          - string
          - 'null'
          description: Product ID related to the invoice line item.
          example: itm_KbLcWt2qm5p1S2
        product_type:
          type:
          - string
          - 'null'
          enum:
          - flat_fee
          - seat
          - dynamic
          - credit
          - bundle
          description: Product type related to the invoice line item.
          example: flat_fee
        units_count:
          type: number
          description: Count of units of the product related to the invoice line item.
          example: 1
        unit_amount:
          type: number
          description: Amount of one unit of the product related to the invoice line
            item. Expressed in currency's smallest unit.
          example: 24000
        amount:
          type: number
          description: Total amount of the invoice line item. Debit or credit can
            be distinguished using the `entry_type` field. Expressed in currency's
            smallest unit.
          example: 24000
        amount_excluding_tax:
          type: number
          description: Total amount without the taxes amount of the invoice line item.
            Expressed in currency's smallest unit.
          example: 20000
        tax_rate:
          type: number
          description: Tax rate of the invoice line item.
          example: 20
        tax_rate_id:
          type:
          - string
          - 'null'
          description: Custom tax rate ID applied to the invoice line item.
          example: null
        tax_amount:
          type: number
          description: Tax amount of the invoice line item. Expressed in currency's
            smallest unit.
          example: 4000
        discount_amount:
          type: number
          description: Amount corresponding to the discounted part of the total amount
            of the invoice line item. Expressed in currency's smallest unit.
          example: 0
        discount_percent:
          type:
          - number
          - 'null'
          description: Percentage applied to compute the discounted part of the invoice
            line amount. Only if coupons applied are percentage based.
        period_starts_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Start date of the period corresponding to the line item charge.
          example: '2024-10-13T00:00:00.000Z'
        period_ends_at:
          type:
          - string
          - 'null'
          format: date-time
          description: End date of the period corresponding to the line item charge.
          example: '2024-11-13T00:00:00.000Z'
        revenue_type:
          type:
          - string
          - 'null'
          enum:
          - recurring
          - variable
          - one_off
          description: 'Revenue type classification of the line item.


            - `recurring`: Recurring revenue (MRR) from subscription products billed
            at regular intervals.

            - `variable`: Variable revenue from usage-based products.

            - `one_off`: One-time revenue from single charges or products billed once.'
          example: recurring
        revenue_interval_count:
          type:
          - number
          - 'null'
          description: For recurring revenue, the number of interval periods between
            billings (e.g., 1 for monthly, 12 for annual).
          example: 1
        revenue_interval_period:
          type:
          - string
          - 'null'
          enum:
          - days
          - weeks
          - months
          - quarters
          - years
          - once
          - all
          description: For recurring revenue, the interval period (days, weeks, months,
            quarters, years).
          example: months
        display_unit_amount:
          type: boolean
          description: Whether the unit amount is displayed on the invoice PDF. Defaults
            to true.
          example: true
        display_service_period:
          type: boolean
          description: Whether the service period dates are displayed in the line
            item description on the invoice PDF. Defaults to true.
          example: true
        original_line_item_id:
          type:
          - string
          - 'null'
          description: ID of the original line item this line item is linked to (used
            for organisation-based billing).
          example: null
      required:
      - id
      - name
      - entry_type
      - product_id
      - product_type
      - units_count
      - unit_amount
      - amount
      - amount_excluding_tax
      - tax_rate
      - tax_rate_id
      - tax_amount
      - discount_amount
      - discount_percent
      - period_starts_at
      - period_ends_at
      - revenue_type
      - revenue_interval_count
      - revenue_interval_period
      - display_unit_amount
      - display_service_period
      - original_line_item_id
    InvoiceCoupon:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: Coupon ID.
          example: cou_DKL4Xcb5VSa8CQ
        name:
          type:
          - string
          - 'null'
          description: Coupon name.
          example: Partner discount
        discount_amount:
          type:
          - number
          - 'null'
          description: Amount to apply as a discount on the total amount (excluding
            taxes) of a subscription. Expressed in the currency's smallest unit.
          example: 2000
        discount_percent:
          type:
          - number
          - 'null'
          description: Percentage to apply as a discount on the amount (excluding
            taxes) of a product.
          example: null
        line_item_ids:
          type:
          - array
          - 'null'
          items:
            type: string
          description: IDs of the line items to which the coupon applies. Null means
            all line items.
          example:
          - ili_0FACNpeoEFkGu3
      required:
      - id
      - name
      - discount_amount
      - discount_percent
      - line_item_ids
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
