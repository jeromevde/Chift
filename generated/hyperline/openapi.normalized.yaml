                  - zendesk
                  - pylon
                  - intercom
                  - front
                  - helpscout
                  - claap
                  - grain
                  - gong
                  - jiminny
                  - posthog
                  description: Provider name.
                provider_account_id:
                  type: string
                  description: ID of the connected provider account.
              required:
              - entity_id
              - provider_name
              - provider_account_id
              description: Reference to the entity in an external provider.
              example:
                entity_id: '123456789'
                provider_name: stripe
                provider_account_id: acc_1234567890
        required:
        - integrations
