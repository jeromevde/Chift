            \ because the customer country doesn't require it.\n- `reverse_charge`:\
            \ No tax rate applied because the customer is eligible to EU reverse charge.\n\
            - `manual`: Tax rate has been manually specified when creating the invoice.\n\
            - `not_eligible`: Tax collection is disabled for the invoice.\n  "
          example: standard
