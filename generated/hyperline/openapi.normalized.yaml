                    - pending
                    - settled
                    - cancelled
                    description: "\nTransaction status.\n\n- `scheduled`: The transaction\
                      \ is scheduled to be processed in the future.\n- `to_process`:\
                      \ The transaction is waiting to be processed by our system.\n\
                      - `pending`: The transaction has been authorized by the related\
                      \ payment processor, but the banking transaction is not yet\
                      \ settled.\n- `settled`: The transaction has been cleared on\
                      \ the banking side, the money transfer is fully completed.\n\
                      - `cancelled`: The transaction has been cancelled and won't\
                      \ be processed again.\n  "
                    example: settled
                  - type: string
                    enum:
                    - failed
                    description: "\nTransaction status.\n\n- `failed`: The transaction\
                      \ failed.\n  "
                    example: failed
                error_type: {}
                error_message: {}
              required:
              - status
              additionalProperties: true
          description: List of transactions related to the invoice.
        public_url:
          type: string
          format: uri
          description: Public URL of the invoice page where the customer can pay the
            invoice.
        issued_at:
          type: string
          format: date-time
          description: Issue date of the invoice.
          example: '2024-10-13T00:00:00.000Z'
