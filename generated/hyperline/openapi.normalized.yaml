    PaymentMethod:
      anyOf:
      - type: object
        properties:
          id:
            type: string
            description: Payment method ID.
            example: pm_1xMpj5bwRqN7LM
          status:
            type: string
            enum:
            - active
            - pending
            - expired
            - errored
            description: "\nPayment method status.\n\n- `active`: The payment method\
              \ is ready to be used.\n- `pending`: The payment method is pending activation\
              \ or being validated.\n  "
            example: active
          type:
            type: string
            enum:
            - card
            - apple_pay
            - google_pay
            description: "\nPayment method type.\n\n- `card`: Credit or debit card\n\
              - `apple_pay`: Apple Pay\n- `google_pay`: Google Pay\n- `direct_debit_sepa`:\
              \ SEPA Direct Debit\n- `direct_debit_ach`: ACH Direct Debit\n- `direct_debit_bacs`:\
              \ Bacs Direct Debit\n- `stripe_link`: Stripe Link\n  "
            example: card
          last_4_digits:
            type:
            - number
            - 'null'
            description: Last four digits of the card.
            example: 2718
          expiration_date:
            type:
            - string
            - 'null'
            description: Expiration date of the card using YYYY-MM format.
            example: 2027-11
          brand:
            type:
            - string
            - 'null'
            description: Brand of the card.
            examples:
            - visa
            - mastercard
            - amex
        required:
        - id
        - status
        - type
        - last_4_digits
        - expiration_date
        - brand
        title: Card
      - type: object
        properties:
          id:
            type: string
            description: Payment method ID.
            example: pm_1xMpj5bwRqN7LM
          status:
            type: string
            enum:
            - errored
            description: "\nPayment method status.\n\n- `errored`: The payment method\
              \ has failed and can no longer be used.\n  "
            example: errored
          error_type:
            type: string
            enum:
            - authentication_required
            - authorization_error
            - insufficient_funds
            - declined
            - expired
            - fraud
            - invalid
            - mandate_invalid
            - not_supported
            - unknown
            description: "\nPayment method error type.\n\n- `authentication_required`:\
              \ The card was declined as the transaction requires authentication (e.g.\
              \ 3-D Secure). The customer should go to their portal page and authenticate\
              \ their card. If the error happened on an already authenticated transaction,\
