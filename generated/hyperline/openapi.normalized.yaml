components:
  schemas:
    CursorPaginatedCustomer:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
          description: List of Customer.
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor to fetch the next page. `null` when there are no more
            items.
          example: null
        has_more:
          type: boolean
          description: Whether more items are available after this page.
          example: false
        total:
          type: number
          description: Total number of items matching the filters. Only present when
            `include_total=true` was passed.
          example: 1
      required:
      - data
      - next_cursor
      - has_more
    CustomerDetails:
      allOf:
      - $ref: '#/components/schemas/Customer'
      - type: object
        properties:
          payment_method:
            description: Default payment method of the customer. Only applies to card
              and direct debit.
            $ref: '#/components/schemas/PaymentMethod'
          bank_account:
            allOf:
            - $ref: '#/components/schemas/BankAccount'
            - anyOf:
              - $ref: '#/components/schemas/StandardBankAccount'
              - $ref: '#/components/schemas/ConnectedBankAccount'
              - type: 'null'
              description: Custom bank account for the customer. If not defined and
                customer paying by bank transfer, the bank accounts configured in
                your account settings will be used.
          organisation_id:
            type:
            - string
            - 'null'
            description: Parent organization ID to which the client is attached.
            example: null
          organisation_invoicing:
            type:
            - string
            - 'null'
            enum:
            - none
            - every_invoice
            - concat
            description: "\nHow customer invoices are issued from the parent organisation.\n\
              \n- `none`: Invoices will keep being issued from this customer.\n- `every_invoice`:\
              \ Customer invoices will be issued from the organisation individually.\n\
              - `concat`: Customer invoices will be grouped into a global parent invoice\
              \ at a regular schedule (configured on the organisation).\n "
            example: null
        required:
        - payment_method
        - bank_account
        - organisation_id
        - organisation_invoicing
    CursorPaginatedInvoice:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
          description: List of Invoice.
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor to fetch the next page. `null` when there are no more
            items.
          example: null
        has_more:
          type: boolean
          description: Whether more items are available after this page.
          example: false
        total:
          type: number
          description: Total number of items matching the filters. Only present when
            `include_total=true` was passed.
          example: 1
      required:
      - data
      - next_cursor
      - has_more
    InvoiceDetails:
      allOf:
      - $ref: '#/components/schemas/Invoice'
      - type: object
        properties:
          integrations:
            type: array
            items:
              type: object
              properties:
                entity_id:
                  type: string
                  description: ID of the entity in the provider.
                provider_name:
                  type: string
                  enum:
                  - adyen
                  - stripe
                  - mollie
                  - gocardless
                  - airwallex
                  - salesforce
                  - hubspot
                  - attio
                  - xero
                  - pennylane
                  - zoho-books
                  - exact-online
                  - quickbooks
                  - netsuite
                  - rillet
                  - datev
                  - anrok
                  - chargebee
                  - slack
