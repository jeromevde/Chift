  /v2/customers/{id}:
    get:
      operationId: getCustomer
      tags:
      - Customers
      security:
      - bearer: []
      summary: Get customer
      description: Retrieve the details of an existing customer.
      parameters:
      - schema:
          type: string
        required: true
        name: id
        in: path
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetails'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
